[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath"
version = "0.1.0"
description = "Open source advisor that shows its work"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0", "jsonschema>=4.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openpath = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
